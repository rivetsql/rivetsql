repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^rivet/
      - id: ruff-format
        files: ^rivet/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        # Use the project's pyproject.toml as the single source of truth for
        # mypy configuration. Do NOT pass --ignore-missing-imports here — it
        # overrides the per-module overrides in pyproject.toml and causes
        # local pre-commit results to disagree with CI.
        # Scope: src/ only. Tests are not yet typed; see ROADMAP / a future
        # cleanup PR to introduce annotations and re-add tests/ to the scope.
        files: ^rivet/src/
        pass_filenames: false
        args: [--config-file=rivet/pyproject.toml, rivet/src]
        additional_dependencies:
          - types-PyYAML>=6.0
          - types-requests>=2.31

  - repo: local
    hooks:
      - id: check-changelog
        name: CHANGELOG hygiene
        entry: python scripts/check_changelog.py
        language: system
        files: ^CHANGELOG\.md$
        pass_filenames: false
      - id: check-module-boundaries
        name: Module boundaries
        entry: python rivet/scripts/check_module_boundaries.py
        language: system
        files: ^rivet/src/.*\.py$
        pass_filenames: false
      - id: check-plugin-coherence
        name: Plugin coherence
        entry: python rivet/scripts/check_plugin_coherence.py
        language: system
        files: ^rivet/src/rivet_(aws|databricks|duckdb|polars|postgres|pyspark|rest)/.*$
        pass_filenames: false
