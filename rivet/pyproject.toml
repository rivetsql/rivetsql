[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rivetsql"
version = "0.1.17"
description = "Core SQL pipeline framework — joints, engines, catalogs"
requires-python = ">=3.11"
license = "MIT"
readme = "../README.md"
authors = [{ name = "Rivet Contributors" }]
keywords = ["sql", "data-pipeline", "etl", "elt", "dbt-alternative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Database",
]
dependencies = [
    "pyarrow>=16.0",
    "sqlglot>=25.0",
    "pyyaml>=6.0",
]

[project.scripts]
rivet = "rivet_cli:main"

[project.urls]
Homepage = "https://github.com/rivetsql/rivetsql"
Documentation = "https://rivetsql.github.io/rivetsql"
Repository = "https://github.com/rivetsql/rivetsql"
Changelog = "https://github.com/rivetsql/rivetsql/blob/main/CHANGELOG.md"

[project.optional-dependencies]
duckdb = ["rivetsql-duckdb>=0.1.0,<0.2.0"]
polars = ["rivetsql-polars>=0.1.0,<0.2.0"]
pyspark = ["rivetsql-pyspark>=0.1.0,<0.2.0"]
postgres = ["rivetsql-postgres>=0.1.0,<0.2.0"]
aws = ["rivetsql-aws>=0.1.0,<0.2.0"]
databricks = ["rivetsql-databricks>=0.1.0,<0.2.0"]
rest = ["rivetsql-rest>=0.1.0,<0.2.0"]
all = [
    "rivetsql-duckdb>=0.1.0,<0.2.0",
    "rivetsql-polars>=0.1.0,<0.2.0",
    "rivetsql-pyspark>=0.1.0,<0.2.0",
    "rivetsql-postgres>=0.1.0,<0.2.0",
    "rivetsql-aws>=0.1.0,<0.2.0",
    "rivetsql-databricks>=0.1.0,<0.2.0",
    "rivetsql-rest>=0.1.0,<0.2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.15",
    "hypothesis>=6.0",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
]
test = [
    "duckdb>=1.1",
    "boto3>=1.28",
    "polars>=1.0",
    "psycopg[binary,pool]>=3.1",
    "pyspark>=3.5",
    "requests>=2.28",
    "textual>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rivet_core", "src/rivet_config", "src/rivet_bridge", "src/rivet_cli"]

[tool.hatch.build.targets.editable]
packages = ["src/rivet_core", "src/rivet_config", "src/rivet_bridge", "src/rivet_cli"]

[tool.pytest.ini_options]
testpaths = ["tests/e2e", "tests/integration", "tests/unit"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests for complex algorithmic logic only",
    "integration: Integration tests exercising multiple components",
    "e2e: End-to-end CLI lifecycle tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "E741", "E402", "SIM102", "SIM103", "SIM105", "SIM108", "SIM117", "B905"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
disable_error_code = ["import-untyped"]

# pyarrow ships stubs but they are incomplete and inconsistent across versions.
# ignore_errors = true suppresses errors *within* pyarrow modules; the attr-defined
# and no-untyped-call errors that appear in our own code when calling pyarrow APIs
# are suppressed via per-package overrides below.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_errors = true
ignore_missing_imports = true

# --- Per-module overrides — each entry is a known pyarrow stub gap or a
# Textual lifecycle constraint, NOT a free pass. To remove an entry from
# this list, write a typed wrapper at the call site (or replace the bare
# pyarrow call with `pa.compute.<...>` whose signature is stubbed) and run
# `mypy --strict <module>` to confirm the override is no longer needed.
# Tracking issue: see ROADMAP.md "Type cleanup".
#
# Our packages that use pyarrow heavily: suppress the stub-quality errors that
# pyarrow 16+ stubs produce (attr-defined on compute functions, no-untyped-call
# on parquet/ipc/dataset functions). These are pyarrow stub gaps, not real bugs.
[[tool.mypy.overrides]]
module = [
    "rivet_core.testing.comparison",
    "rivet_core.testing.fixtures",
    "rivet_core.interactive.exporter",
    "rivet_core.interactive.profiler",
    "rivet_core.builtins.filesystem_catalog",
    "rivet_core.executor.helpers.arrow_helpers",
    "rivet_core.executor.helpers.checks",
    "rivet_cli.repl.widgets.results",
    "rivet_cli.commands.test",
    "rivet_duckdb.filesystem_sink",
    "rivet_databricks.engine",
    "rivet_aws.s3_source",
    "rivet_aws.s3_sink",
    "rivet_aws.s3_catalog",
    "rivet_aws.glue_catalog",
    "rivet_aws.glue_source",
    "rivet_rest.adapter",
]
disable_error_code = ["attr-defined", "no-untyped-call"]

# Packages that are not installed in the lint job (only [dev] extras, not [test]).
# They have no stubs available at lint time so imports must be ignored.
[[tool.mypy.overrides]]
module = [
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "duckdb",
    "duckdb.*",
    "polars",
    "polars.*",
    "pyspark",
    "pyspark.*",
    "pandas",
    "pandas.*",
    "databricks.*",
    "textual",
    "textual.*",
    "psycopg",
    "psycopg.*",
    "psycopg_pool",
    "psycopg_pool.*",
    "deltalake",
    "deltalake.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "rivet_cli.repl.*",
]
disable_error_code = ["misc", "no-any-return", "untyped-decorator"]

[tool.coverage.run]
source = ["src"]
omit = ["src/rivet_cli/repl/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
