name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR cancels in-flight runs of the same ref. Pushes to main
# are never cancelled (we always want a green build artifact for the tip).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: rivet/pyproject.toml
      - run: pip install -e "./rivet[dev,test]"
      - run: ruff check src tests
        working-directory: rivet
      # mypy is intentionally scoped to src/ only. Type-checking tests/
      # against --strict produces ~899 untyped-fixture noise that should be
      # paid down in a dedicated cleanup PR before being gated in CI.
      - run: mypy src
        working-directory: rivet

  checks:
    name: Internal quality scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: rivet/pyproject.toml
      - run: pip install -e "./rivet[dev]"
      - name: Module boundaries
        run: python rivet/scripts/check_module_boundaries.py
      - name: Plugin coherence
        # Non-blocking: the script flags pre-existing capability-matrix
        # gaps for multi-package plugins (rivet_aws → s3+glue, rivet_databricks
        # → databricks+unity, rivet_rest → rest_api) that the audit cannot yet
        # express. Treat as advisory until the matrix model is generalised.
        continue-on-error: true
        run: python rivet/scripts/check_plugin_coherence.py
      - name: Dependency audit
        run: python rivet/scripts/audit_dependencies.py
      - name: Dead code
        run: python rivet/scripts/find_dead_code.py
      - name: Stale docs
        run: python rivet/scripts/flag_stale_docs.py
      - name: CHANGELOG hygiene
        run: python scripts/check_changelog.py

  test:
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            os: ubuntu-latest
            test-scope: "tests"
          - python-version: "3.12"
            os: ubuntu-latest
            test-scope: "tests"
          - python-version: "3.12"
            os: macos-latest
            test-scope: "tests"
          - python-version: "3.13"
            os: ubuntu-latest
            test-scope: "tests"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: rivet/pyproject.toml
      - run: pip install -e "./rivet[dev,test]"
      - run: pytest ${{ matrix.test-scope }} -n auto
        working-directory: rivet

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: rivet/pyproject.toml
      - run: pip install -e "./rivet[dev,test]"
      - run: pytest tests --cov=src --cov-report=xml --cov-report=term-missing -n auto
        working-directory: rivet
      - uses: codecov/codecov-action@v6
        with:
          files: rivet/coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: rivet/pyproject.toml
      - run: pip install -e "./rivet[dev,test]"
      - name: pip-audit (advisory)
        # Non-blocking: a transient CVE in an unrelated transitive dep should
        # not gate PR merges. Failures are surfaced as PR annotations and
        # tracked via the issue tracker (see CONTRIBUTING.md "Security audits").
        continue-on-error: true
        run: pip install pip-audit && pip-audit
